<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9A0A1">
<title>Матура по БЕЛ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  --paper:#F9D9D8; --surface:#FFF8F8; --surface-2:#FDEDEC; --ink:#241A1C; --muted:#74545A; --line:#EDBFC0;
  --accent:#C2485E; --accent-ink:#FFFFFF; --accent-soft:#FBE1E2; --mark:#F9CDD1; --mark-ink:#4A1D25;
  --good:#1B7646; --good-soft:#E3F3EA; --bad:#B3261E; --bad-soft:#FBE3DF;
  --side:linear-gradient(180deg,#E9A0A1 0%,#E3918F 55%,#DA8082 100%); --side-ink:#241517; --side-line:#D47A7D;
  --latch:#1D1719; --latch-ink:#F7B8BD; --rose:#E8A9AD; --rose-ink:#3A1A20; --hover:rgba(255,255,255,.45);
  --radius:10px; --shadow:0 1px 2px rgba(80,30,38,.06),0 4px 16px rgba(194,72,94,.07);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141011; --surface:#1E1719; --surface-2:#251C1F; --ink:#F7E8E9; --muted:#BFA2A7; --line:#3A2B2F;
    --accent:#F29EA6; --accent-ink:#1A1214; --accent-soft:#3A2127; --mark:#5E2A34; --mark-ink:#FFE3E6;
    --good:#58C48A; --good-soft:#15301F; --bad:#FF8A7A; --bad-soft:#3D1B18;
    --side:linear-gradient(180deg,#3A2127 0%,#2E1A1F 100%); --side-ink:#F7E8E9; --side-line:#4A2C33;
    --latch:#F29EA6; --latch-ink:#1A1214; --rose:#6B3640; --rose-ink:#FFE3E6; --hover:rgba(242,158,166,.1);
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141011; --surface:#1E1719; --surface-2:#251C1F; --ink:#F7E8E9; --muted:#BFA2A7; --line:#3A2B2F;
  --accent:#F29EA6; --accent-ink:#1A1214; --accent-soft:#3A2127; --mark:#5E2A34; --mark-ink:#FFE3E6;
  --good:#58C48A; --good-soft:#15301F; --bad:#FF8A7A; --bad-soft:#3D1B18;
  --side:linear-gradient(180deg,#3A2127 0%,#2E1A1F 100%); --side-ink:#F7E8E9; --side-line:#4A2C33;
  --latch:#F29EA6; --latch-ink:#1A1214; --rose:#6B3640; --rose-ink:#FFE3E6; --hover:rgba(242,158,166,.1);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;line-height:1.2;margin:0 0 .5em}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
h4{font-size:.95rem;font-weight:700;margin-top:1.2em}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .small{font-size:.85rem} .tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .4em}
.lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 16px;border-right:1px solid var(--side-line);background:var(--side);display:flex;flex-direction:column;gap:24px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.15;color:var(--side-ink);text-decoration:none;display:block}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--side-ink);opacity:.7;margin-top:4px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a{color:var(--side-ink)}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--latch);color:var(--latch-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--side-ink);opacity:.7}
main{padding-inline:clamp(16px,4vw,48px);padding-block:32px 80px;min-width:0}
#view{max-width:1040px;margin:0 auto;outline:none;display:flex;flex-direction:column;gap:24px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app>*{min-width:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;padding:10px 0 0;flex-direction:column;gap:6px;border-right:0;border-bottom:1px solid var(--side-line)}
  .brand{padding-inline:16px}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:.92rem}
  .nav svg{display:none}
  .side-foot{display:none}
  main{padding-block:20px 60px}
}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:20px;align-items:start}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.row.wrap{align-items:flex-end}
.grow{flex:1 1 200px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.file{cursor:pointer}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{resize:vertical;line-height:1.55}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.fld>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.row .fld{margin-top:0}
.warn{background:var(--bad-soft);color:var(--ink);border-left:3px solid var(--bad);padding:10px 14px;border-radius:6px;margin-top:12px}
.thinking{padding:14px 16px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:500;margin-top:12px;display:flex;align-items:center;gap:10px}
.thinking::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::before{animation:none}}

/* home */
.hero{padding-top:8px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);max-width:16ch}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:640px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.quick{grid-template-columns:1fr}}
.qa{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);cursor:pointer;text-decoration:none}
.qa:hover:not(:disabled){border-color:var(--accent)}
.qa:disabled{opacity:.55;cursor:default}
.qa span{font-size:.85rem;color:var(--muted)}
.weak{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.weak li{display:grid;grid-template-columns:1fr 90px 40px;gap:10px;align-items:center}
.meter{display:block;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent)}

/* works */
.page-head{padding-top:4px}
.cls-h{font-family:var(--f-display);font-size:1.6rem;font-weight:700;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.theme{display:grid;grid-template-columns:200px 1fr;gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.theme-h{font-size:.95rem;color:var(--muted);font-weight:600;padding-top:12px}
@media (max-width:720px){.theme{grid-template-columns:1fr;gap:8px}.theme-h{padding-top:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.wauthor{font-size:.8rem;color:var(--muted);font-weight:500}
.wtitle{font-family:var(--f-text);font-size:1.12rem;font-weight:600;line-height:1.3}
.wmeta{font-size:.8rem;color:var(--muted);margin-top:4px}

.crumbs{font-size:.85rem;color:var(--muted)}
.work-head h1{font-family:var(--f-text);font-weight:600;font-size:clamp(1.8rem,4.5vw,2.8rem);letter-spacing:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:12px 0 0}
.facts dt{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts dd{margin:0;font-weight:600}
.work-body{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
@media (max-width:900px){.work-body{grid-template-columns:1fr}}
.study{display:flex;flex-direction:column;gap:22px;max-width:68ch}
.study h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.5em}
.study ul{margin:0;padding-left:1.2em}
.study li{margin-bottom:.35em}
.study p{font-size:1.02rem}
mark,.hl{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 1px}
blockquote{margin:0 0 10px;padding:10px 16px;border-left:3px solid var(--accent);background:var(--surface);font-family:var(--f-text);font-style:italic;font-size:1.05rem;border-radius:0 6px 6px 0;white-space:pre-line}
.side-note{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.side-note h2{font-size:1rem}
.side-note textarea{font-family:var(--f-text);background:repeating-linear-gradient(var(--surface) 0 27px,var(--line) 27px 28px);line-height:28px;border-radius:6px;padding-top:0}

/* quiz */
.page-narrow{max-width:720px;margin:0 auto;width:100%}
.quiz{display:flex;flex-direction:column;gap:12px}
.quiz-top{display:flex;justify-content:space-between;align-items:baseline}
.quiz-top .eyebrow{margin:0}
.count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-src{font-size:.8rem;color:var(--muted);margin:0;font-weight:500}
.q-text{font-size:1.2rem;font-weight:600;line-height:1.4;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.letter{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.right,.mopt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .letter,.mopt.right .letter{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong,.mopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter,.mopt.wrong .letter{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.fb{padding:10px 14px;border-radius:8px;border-left:3px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.quiz-actions{display:flex;justify-content:space-between;gap:10px}
.result{display:flex;flex-direction:column;gap:14px}
.grade-card{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.grade-num{font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.grade-num small{font-size:1rem;color:var(--muted)}
.grade-name{font-weight:700;font-size:1.15rem}
.review{padding-left:1.3em;display:flex;flex-direction:column;gap:14px}
.review li p{margin:0 0 4px}
.red-pen s{color:var(--bad);text-decoration-thickness:2px}
.red-pen>span{color:var(--good);font-weight:600}
.keyline{border-left:3px solid var(--good);padding-left:10px;font-weight:500}
.yours{font-family:var(--f-text);font-style:italic;color:var(--muted)}

/* tests cfg */
.cfg fieldset{border:0;padding:0;margin:0 0 16px}
.cfg legend{font-weight:700;margin-bottom:8px;font-size:.95rem}
.chk{display:inline-flex;align-items:center;gap:8px;margin-right:18px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input,.seg input{position:absolute;opacity:0;pointer-events:none}
.chip span,.seg span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.9rem;background:var(--surface)}
.chip input:checked+span,.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span,.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px}
.seg span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist th,.hist td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:.78rem;color:var(--muted);font-weight:600}
.hist .r{text-align:right}

/* open */
.keybox{margin-top:12px;padding:14px 16px;border:1px dashed var(--good);border-radius:8px;background:var(--good-soft)}
.keybox h4{margin-top:0}
.feedback{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.feedback.big{background:var(--surface)}
.fb-score{display:flex;gap:16px;align-items:center}
.fb-score p{margin:0}
.pts{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1}
.pts small{font-size:1rem;color:var(--muted)}
.good li::marker{color:var(--good)}
.miss li::marker{color:var(--bad)}
.errs{list-style:none;padding:0}
.errs li{padding:6px 0;border-bottom:1px dotted var(--line)}
.better{font-family:var(--f-text);background:var(--surface);padding:12px 14px;border-radius:8px;border:1px solid var(--line)}
details.panel summary{cursor:pointer}

/* dzi */
.links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.links li{display:flex;flex-direction:column}
.links a{font-weight:600}
.plan{padding-left:1.2em}
.mock{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.part{font-family:var(--f-display);font-size:1rem;font-weight:500;margin-top:18px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mq{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);margin:0}
.mq legend{font-weight:600;padding:0 4px;float:left;width:100%;margin-bottom:8px}
.mq legend .q-src{display:block;font-weight:400}
.num{font-family:var(--f-display);font-weight:700;color:var(--accent);margin-right:4px}
.mopt{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;clear:both}
.mopt input{accent-color:var(--accent)}
.oq{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.oq .q-src{display:inline}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
.topic-btn{font:inherit;text-align:left;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);cursor:pointer;font-family:var(--f-text);font-size:1.02rem}
.topic-btn .eyebrow{display:block;font-family:var(--f-body)}
.topic-btn:hover{border-color:var(--accent)}

/* lang */
.lang-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
@media (max-width:760px){.lang-layout{grid-template-columns:1fr}}
.topics{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
@media (max-width:760px){.topics{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}.topics .area{width:100%}}
.topics .area{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 2px}
.topics a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.93rem}
.topics a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0}
.rules ul{padding-left:1.2em}
.rules li{margin-bottom:.4em}
.rule-box{background:linear-gradient(transparent,transparent),var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--mark);padding:12px 14px;border-radius:6px;margin:12px 0}
.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px}
.terms dt{font-weight:700}
.terms dd{margin:0}
@media (max-width:520px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:8px}}
#l-q{margin-top:18px}
.edit-src{font-style:normal}

/* writing */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
#w-main{display:flex;flex-direction:column;gap:20px}
.structure{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;counter-reset:s}
.sblock{padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.shead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.sblock p{margin:0;font-size:.93rem}
.rules-list li,.miss li{margin-bottom:.5em}
.crit{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.crit li{display:flex;flex-direction:column}
.crit span{font-size:.88rem;color:var(--muted)}
.example .ex-title{font-family:var(--f-text);font-size:1.4rem;font-weight:600;text-align:center;margin:12px 0 18px}
.ex-body{max-width:68ch;margin:0 auto;font-family:var(--f-text);font-size:1.04rem;line-height:1.75}
.ex-part{display:grid;grid-template-columns:120px 1fr;gap:16px}
.ex-part p{text-indent:1.5em}
.ex-role{font-family:var(--f-body);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;padding-top:6px;text-align:right;border-right:2px solid var(--accent-soft);padding-right:12px}
@media (max-width:600px){.ex-part{grid-template-columns:1fr;gap:2px}.ex-role{text-align:left;border:0;padding:0}}
.topic-list{display:flex;flex-wrap:wrap;gap:8px}
.topic{font:inherit;font-family:var(--f-text);text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);cursor:pointer}
.topic:hover{border-color:var(--accent)}
.paper{font-family:var(--f-text);font-size:1.04rem;background:repeating-linear-gradient(var(--surface) 0 29px,var(--line) 29px 30px);line-height:30px;padding-top:2px;min-height:420px}
.crit-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem}
.crit-table th,.crit-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.crit-table th{width:28%;font-weight:600}
.crit-table td:nth-child(3){width:80px;padding-top:14px}
@media (max-width:600px){.crit-table td:nth-child(3){display:none}}

/* notes */
.notes-bar input{flex:1 1 220px;width:auto}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column}
.note p{font-family:var(--f-text);white-space:pre-line;flex:1}
.note-edit{display:flex;flex-direction:column;gap:10px}
.note-edit input{font-weight:700}
.cls{display:flex;flex-direction:column}
/* history */
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.panel-head h2{margin:0}
.panel-head a{font-size:.9rem;font-weight:600;text-decoration:none}
.hrows{list-style:none;padding:0;margin:0}
.hrows li a{display:grid;grid-template-columns:78px auto 1fr auto;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);border-radius:6px}
.hrows li:last-child a{border-bottom:0}
.hrows li a:hover{background:var(--surface-2)}
.hdate{font-size:.85rem;font-weight:600;line-height:1.2}
.hdate small{display:block;color:var(--muted);font-weight:400}
.htitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscore{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;justify-self:end}
.meter.sm{width:54px;height:5px}
.pill{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.t-test,.pill.t-ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.t-lang,.pill.t-edit{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.t-mock{background:var(--latch);color:var(--latch-ink);border-color:transparent}
.pill.t-essay,.pill.t-open{background:var(--rose);color:var(--rose-ink);border-color:transparent}
@media (max-width:560px){.hrows li a{grid-template-columns:auto 1fr auto;grid-template-areas:"pill pill score" "title title title";row-gap:4px}.hdate{display:none}.pill{grid-area:pill;justify-self:start}.htitle{grid-area:title;white-space:normal}.hscore{grid-area:score}}
.hday{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px}
.hday:first-child{margin-top:0}
.hfilter{margin-top:-4px}
.chip small{opacity:.7;margin-left:2px}
.stat .v.up{color:var(--good)} .stat .v.down{color:var(--bad)}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:340px;height:auto;display:block}
#view>*,.panel,.grid2>*{min-width:0}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:default}
.chart .pt:hover .dot{r:5}
.h-title{font-family:var(--f-text);font-weight:600;font-size:clamp(1.3rem,3.5vw,2rem)}
.hbody{display:flex;flex-direction:column;gap:10px}
.hbody h2{margin-top:10px}
.yours.big{font-size:1.05rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-line}
.essay-text{font-family:var(--f-text);line-height:1.75;max-width:68ch}
.essay-text p{text-indent:1.5em;margin:0 0 .6em}
.review li.is-ok{opacity:.8}
.lang-hist{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.backup .row{margin-top:4px}
body[data-ai="off"] .ai-gen{display:none}
body:not([data-sync="in"]):not([data-sync="out"]) .nav-acct,body:not([data-sync="in"]):not([data-sync="out"]) .sync-foot{display:none}
body[data-sync="in"] .local-note,body[data-sync="out"] .local-note{display:none}
.sync-foot{color:inherit;text-decoration:none;display:flex;gap:6px;align-items:center}
.sync-foot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sync-foot[data-state="off"]::before{background:var(--muted)}
.sync-foot[data-state="error"]::before{background:var(--bad)}
.sync-foot[data-state="busy"]::before{background:var(--accent)}
.acct{max-width:520px}
.acct-form input{width:100%}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.sync-line{color:var(--muted)}
.copyai{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface)}
.copyai p{margin:0}

</style>
</head>
